<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Toko PWA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:white;
    padding:28px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px 20px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="login-box">
    <h1>Login Sistem</h1>

    <form id="formLogin">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Masuk</button>
    </form>
</div>

<script>
const API_BASE = 'http://localhost/api-toko';

document
.getElementById("formLogin")
.addEventListener("submit", function(e){
    e.preventDefault();

    fetch(API_BASE + '/login.php', {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            username:document.getElementById("username").value,
            password:document.getElementById("password").value
        })
    })
    .then(response => response.json())
    .then(result => {
        if(result.status === 'success'){
            localStorage.setItem('token_toko', result.token);
            alert(result.message);
            window.location.href = 'index.html';
        }else{
            alert(result.message);
        }
    })
    .catch(error => {
        console.log(error);
        alert('Login gagal. Cek koneksi API.');
    });
});
</script>

</body>
</html>
