<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Barang Toko</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#dff6ff,#bdefff,#eaf8ff);
    min-height:100vh;
    padding:30px;
    color:#0f172a;
}

.container{
    max-width:1120px;
    margin:auto;
    background:#ffffff;
    padding:26px;
    border-radius:26px;
    border:1px solid #ccecff;
    box-shadow:0 14px 35px rgba(72,178,230,0.22);
}

.header{
    background:linear-gradient(135deg,#eaf8ff,#d8f3ff,#f7fcff);
    border:1px solid #d5f0ff;
    border-radius:20px;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:22px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-mini{
    width:54px;
    height:54px;
    background:linear-gradient(135deg,#7dd3fc,#38bdf8);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    box-shadow:0 8px 18px rgba(56,189,248,0.35);
}

.logo-mini svg{
    width:27px;
    height:27px;
}

h1{
    color:#0f172a;
    font-size:28px;
    font-weight:800;
}

.subtitle{
    color:#64748b;
    font-size:15px;
    margin-top:4px;
}

.form-card{
    background:#f8fdff;
    border:1px solid #d5f0ff;
    border-radius:18px;
    padding:20px;
    margin-bottom:22px;
}

.form-title{
    font-size:20px;
    font-weight:800;
    color:#075985;
    margin-bottom:16px;
}

input{
    width:100%;
    padding:13px 16px;
    border:1px solid #bae6fd;
    border-radius:12px;
    font-size:16px;
    outline:none;
    color:#0f172a;
    background:#ffffff;
}

input::placeholder{
    color:#94a3b8;
}

input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 4px rgba(56,189,248,0.18);
}

input[type="file"]{
    background:#ffffff;
    cursor:pointer;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:2px;
    font-weight:700;
    transition:0.2s;
}

button:disabled{
    background:#b8c7d4 !important;
    color:white;
    cursor:not-allowed;
}

#btnSubmit{
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    color:white;
    box-shadow:0 8px 16px rgba(14,165,233,0.22);
}

#btnSubmit:hover{
    background:linear-gradient(135deg,#0ea5e9,#0284c7);
}

.btn-edit{
    background:#7dd3fc;
    color:#075985;
}

.btn-edit:hover{
    background:#38bdf8;
    color:white;
}

.btn-hapus{
    background:#fca5a5;
    color:#7f1d1d;
}

.btn-hapus:hover{
    background:#ef4444;
    color:white;
}

.logout-btn{
    background:#e0f7ff;
    color:#075985;
    border:1px solid #7dd3fc;
}

.logout-btn:hover{
    background:#38bdf8;
    color:white;
}

.dashboard-box{
    background:linear-gradient(135deg,#f8fdff,#eaf8ff);
    border:1px solid #ccecff;
    border-radius:18px;
    padding:16px;
    margin:20px auto;
    max-width:720px;
    box-shadow:0 6px 16px rgba(72,178,230,0.15);
}

.dashboard-box h2{
    text-align:center;
    margin-bottom:12px;
    color:#075985;
    font-size:20px;
    font-weight:800;
}

.chart-wrapper{
    max-width:620px;
    height:230px;
    margin:auto;
}

#myChart{
    width:100% !important;
    height:230px !important;
}

.search-box{
    background:#f8fdff;
    border:1px solid #d5f0ff;
    border-radius:16px;
    padding:16px;
    margin:20px 0;
}

.search-label{
    font-size:16px;
    font-weight:800;
    color:#075985;
    margin-bottom:10px;
}

.table-card{
    border:1px solid #ccecff;
    border-radius:18px;
    overflow:hidden;
    background:white;
    box-shadow:0 6px 18px rgba(72,178,230,0.12);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    color:white;
    padding:15px;
    font-size:15px;
}

td{
    padding:13px;
    text-align:center;
    border-bottom:1px solid #e0f2fe;
    color:#0f172a;
}

tr:hover{
    background:#f0faff;
}

.thumbnail{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #bae6fd;
    background:#f8fdff;
}

.gambar-kosong{
    color:#94a3b8;
    font-size:13px;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:20px;
}

.pagination button{
    background:#e0f7ff;
    color:#075985;
    border:1px solid #7dd3fc;
}

.pagination button:hover{
    background:#38bdf8;
    color:white;
}

#infoHalaman{
    font-weight:800;
    color:#075985;
    background:#f0faff;
    border:1px solid #bae6fd;
    padding:10px 16px;
    border-radius:999px;
}

.footer{
    text-align:center;
    margin-top:24px;
    color:#64748b;
    font-size:15px;
}

@media(max-width:768px){
    body{
        padding:14px;
    }

    .container{
        padding:18px;
        border-radius:20px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    h1{
        font-size:24px;
    }

    table{
        font-size:13px;
    }

    th,td{
        padding:10px;
    }

    .thumbnail{
        width:55px;
        height:55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="header-title">
            <div class="logo-mini">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 7h12l1 14H5L6 7z"></path>
                    <path d="M9 7a3 3 0 0 1 6 0"></path>
                    <path d="M9 11c.8.8 1.8 1.2 3 1.2s2.2-.4 3-1.2"></path>
                </svg>
            </div>

            <div>
                <h1>Daftar Barang Toko</h1>
                <div class="subtitle">Dashboard pemantauan stok, harga, dan data barang</div>
            </div>
        </div>

        <button type="button" class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="form-card">
        <div class="form-title">Form Data Barang</div>

        <form id="formBarang" enctype="multipart/form-data">

            <input type="hidden" id="id_barang">

            <div style="margin-bottom:15px;">
                <input type="text" id="nama_barang" placeholder="Nama Barang" required>
            </div>

            <div style="margin-bottom:15px;">
                <input type="number" id="harga" placeholder="Harga" required>
            </div>

            <div style="margin-bottom:15px;">
                <input type="number" id="stok" placeholder="Stok" required>
            </div>

            <div style="margin-bottom:15px;">
                <input type="file" id="gambar" accept="image/jpeg,image/png,image/webp">
            </div>

            <button type="submit" id="btnSubmit">
                Simpan Barang
            </button>

        </form>
    </div>

    <div class="dashboard-box">
        <h2>Dashboard Top 5 Barang Termahal</h2>

        <div class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div class="search-box">
        <div class="search-label">Cari Barang</div>
        <input 
            type="text" 
            id="inputCari" 
            placeholder="Ketik nama barang..."
            onkeyup="cariBarang()">
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Gambar</th>
                    <th>Nama Barang</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="dataBarang"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button id="btnPrev" onclick="pindahHalaman('prev')">Prev</button>
        <span id="infoHalaman">Halaman 1 dari 1</span>
        <button id="btnNext" onclick="pindahHalaman('next')">Next</button>
    </div>

    <div class="footer">
        Dihan Palupi | 231220151 | Pemograman Berbasis Platform
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
